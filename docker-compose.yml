services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiinbox
      POSTGRES_PASSWORD: aiinbox
      POSTGRES_DB: aiinbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://aiinbox:aiinbox@db:5432/aiinbox?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
